[package]
name = "sermonindex-app"
version = "0.0.337"
description = "SermonIndex Sermon Library — Decentralized P2P sermon sharing"
authors = ["SermonIndex"]
license = ""
repository = ""
edition = "2021"
# Raised from 1.77.2 for librqbit 9, which is edition 2024 (requires rustc 1.85+).
# This crate itself stays on edition 2021; only the toolchain floor moves.
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Borrowed from the CLI along with src/system.rs, so the node display can report
# the same host metrics (CPU, memory, disk, throughput) the CLI's dashboard does.
# Same version the CLI pins, so the two behave identically.
sysinfo = "0.32"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
dirs = "5"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
# Detached ed25519 signature verification for the canonical master list
ed25519-dalek = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

# ── BitTorrent node (librqbit — the engine behind rqbit) ──
# Mainline DHT + trackers + UPnP. Replaces the hand-rolled IPFS stack.
librqbit = "9.0.0-rc.0"
# librqbit returns anyhow::Error; we inspect the error chain to tell a
# port-already-in-use bind failure from a real startup failure (torrent_node.rs).
anyhow = "1"
url = "2"
urlencoding = "2"
# NAT-PMP + PCP port mapping — succeeds on many routers where UPnP is off/unsupported
crab_nat = "0.2"
# Native HTTP fetch for the master list (webview fetch is blocked by CDN CORS)
reqwest = "0.12"
# Prevent two copies running at once (duplicate instances corrupt session state)
tauri-plugin-single-instance = "2"
# Auto-updater (signed releases from the CDN) + process restart support
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

tokio = { version = "1", features = ["full"] }

# ── Unix-only ────────────────────────────────────────────────────────────────
# `src/system.rs` (borrowed from the CLI) calls `libc::statvfs` to read free
# space on the mount the library lives on, inside a `#[cfg(unix)]` block — the
# Windows arm of that function uses a different call and never touches libc.
# Gated to unix for the same reason: an unconditional dependency would pull it
# into the Windows build for code that cannot run there.
#
# MUST STAY AT THE END OF THIS FILE. A `[target....]` table inserted into the
# middle of `[dependencies]` silently swallows every dependency listed after it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
